# Primeiro mês: banco SQL H2 dentro desta pasta, sem instalar MySQL.
# Os produtos permanecem depois de parar e reiniciar o Java.
spring.datasource.url=jdbc:h2:file:./dados/loja
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Só para este projeto local de aprendizagem.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console SQL para demonstração do professor (não publicar na internet).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Apenas o próprio computador pode abrir o projeto.
server.address=127.0.0.1
server.port=8080
